modName = NTM-IT

# This is a case-sensitive string to identify your mod. Convention is to use lower case.
# FML 1.12.2's sanityCheckModId() only enforces: non-empty, <=64 chars, all lowercase.
# A hyphen is NOT forbidden by FML (checked DependencyParser + FMLModContainer) and
# 1.12.2 ResourceLocation performs no charset validation, so 'ntm-it' is legal.
modId = ntm-it

modGroup = com.ntmit

# Version of your mod.
modVersion = beta0.1.8

# Whether to use the old jar naming structure (modid-mcversion-version) instead of the new version (modid-version)
includeMCVersionJar = false

# The name of your jar when you produce builds, not including any versioning info
modArchivesBaseName = ntm-it

# Will update your build.gradle automatically whenever an update is available
autoUpdateBuildScript = false

minecraftVersion = 1.12.2

developmentEnvironmentUserName = Developer

# Enables using modern java syntax (up to version 17) via Jabel, while still targeting JVM 8.
enableModernJavaSyntax = true

# Generate a class with String fields for the mod id, name and version named with the fields below
generateGradleTokenClass = com.ntmit.Tags
gradleTokenModId = MODID
gradleTokenModName = MODNAME
gradleTokenVersion = VERSION

# NTM-IT ships no API for other mods, so this stays empty.
apiPackage =
useSrcApiPath = false

# Must be set and the referenced file MUST exist (build.gradle validates it), hence the stub file.
accessTransformersFile = ntm_it_at.cfg

usesMixins = true
mixinsPackage = mixin
# Mixin 提供者坐标。**必须覆盖 Buildscripts 的默认值** `zone.rong:mixinbooter:10.6`
# (build.gradle 里 propertyDefaultIfUnset("mixinProviderSpec", "zone.rong:mixinbooter:10.6"))：
# 该 artifact 在 GTNH Nexus public 仓库不存在（已用 Nexus REST search 验证返回空），
# 而下面这个 CurseMaven 坐标是 HBM 本体自己用的同一个 jar（HBM dependencies.gradle:59），
# 且已存在于本机 Gradle 缓存（可离线解析）。MixinBooter 10.7 的 jar 内完整包含
# org.spongepowered.asm.*，因此 @Mixin 可直接编译。详见 SERVER_PLAN.md §2.4。
mixinProviderSpec = curse.maven:mixin-booter-419286:7049694

generateMixinConfig = true
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# No publishing configured (HBM itself publishes no API maven artifact either).
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =
releaseType = release
generateDefaultChangelog = false
noPublishedSources = false
customMavenPublishUrl =
mavenArtifactGroup =

enableSpotless = false
enableJUnit = false
deploymentDebug = false

# Keep the dev environment lean (no JEI/TOP auto-injected). Flip to true if you want them.
includeCommonDevEnvMods = false


# Gradle Settings
org.gradle.logging.stacktrace = all
# Sets default memory used for gradle commands. This is required to provide enough memory
# for the Minecraft decompilation process.
# -Dfile.encoding=UTF-8 also makes javac's diagnostics come back as UTF-8; without it they are
# emitted in the platform codepage (GBK here) and arrive as mojibake in most terminals.
org.gradle.jvmargs = -Xmx4G -Dfile.encoding=UTF-8
# Additional java arguments for runClient and runServer. The host has 16.5GB RAM total,
# so keep this well below that (HBM's own value of -Xmx16G would overcommit the machine).
additionalJavaArguments = -Xmx6G

# Gradle itself (and the IDE's Gradle import) runs on JDK 17, which is ALSO the compile
# toolchain required by enableModernJavaSyntax. They MUST be the same JVM on this machine:
# the user home (C:\Users\欣欣\...) is non-ASCII, and Gradle hands a forked compiler its
# classpath through a UTF-8 @argfile under <gradle home>/.tmp. A JDK 17 launcher decodes
# argfiles using file.encoding=GBK, so forking to a *different* JVM mis-decodes those paths
# and the worker dies with
#   ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain
# (JDK 22/25 launchers default to UTF-8, which is why a JDK 22 daemon appeared to work and
# why HBM's own project can look healthy.) With daemon == toolchain Gradle compiles
# in-process and never writes that argfile.
# MC 1.12.2 still needs a JDK 8 toolchain, so that stays declared below.
# NOTE: do NOT split the installations value across lines - a .properties file has no implicit
# line continuation, so a trailing value would silently become an empty property.
org.gradle.java.home=C:/Program Files/Java/jdk-17
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-17,C:/Program Files/Java/jdk1.8.0_202,C:/Program Files/Java/jdk-22
